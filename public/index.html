<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c11" media="(prefers-color-scheme: dark)">
  <title>Shop Crackers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/">
        <span class="logo" aria-hidden="true">✨</span>
        <span class="brand-text"><h1 id="shopName">Crackers</h1><span class="tagline" id="tagline"></span></span>
      </a>
      <span class="spacer"></span>
      <a class="icon-btn" href="/checkout" id="cartLink" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="count num" id="cartCount" data-zero>0</span>
      </a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h2>Light up your celebration 🎆</h2>
      <p>Pick your crackers, pay by UPI, and you're done.</p>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="q" type="search" placeholder="Search sparklers, rockets…" autocomplete="off" aria-label="Search">
      </div>
    </section>

    <div id="closed" class="banner warn hidden"></div>
    <a id="lastBill" class="banner ok hidden"></a>
    <div class="offers" id="offers"></div>

    <div class="toolbar">
      <div class="chips" id="chips" role="toolbar" aria-label="Categories"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <div class="cartbar" id="cartbar">
    <div class="sum">
      <div class="top"><span id="barCount">0 items</span><span id="barSave" class="save"></span></div>
      <b class="num" id="barTotal">₹0</b>
      <div class="nudge" id="barNudge"></div>
    </div>
    <a class="btn btn-primary btn-lg" href="/checkout">View cart
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
