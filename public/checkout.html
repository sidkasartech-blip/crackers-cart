<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c11" media="(prefers-color-scheme: dark)">
  <title>Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="icon-btn" href="/" aria-label="Back to shop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </a>
      <span class="page-title">Your cart</span>
      <span class="spacer"></span>
      <a class="btn btn-sm btn-ghost" href="/">+ Add more</a>
    </div>
  </header>

  <main class="wrap">
    <div id="empty" class="empty hidden">
      <div class="big">🛍️</div>
      <p>Your cart is empty.</p>
      <a class="btn btn-primary" href="/">Browse crackers</a>
    </div>

    <div class="checkout hidden" id="checkout">
      <section>
        <div class="card" id="lines"></div>
        <div id="closed" class="banner warn hidden"></div>
      </section>

      <aside class="summary card pad">
        <div class="card-title">Offers</div>
        <div class="coupon">
          <input class="input" id="coupon" placeholder="Coupon code" autocomplete="off" autocapitalize="characters" aria-label="Coupon code">
          <button class="btn" id="applyCoupon" type="button">Apply</button>
        </div>
        <div class="coupon-msg" id="couponMsg"></div>

        <hr class="divider">
        <div class="card-title">Bill summary</div>
        <table class="totals" id="totals"></table>
        <div class="nudge" id="nudge" style="margin-top:8px"></div>

        <hr class="divider">
        <div id="fulfilWrap" class="hidden">
          <div class="card-title">How would you like it?</div>
          <div class="fulfil" role="radiogroup" aria-label="Pickup or delivery">
            <label class="fulfil-opt"><input type="radio" name="fulfil" value="pickup" checked>
              <span class="fo-ic">🏪</span><span><b>Pickup at store</b><small>Collect from our shop</small></span></label>
            <label class="fulfil-opt"><input type="radio" name="fulfil" value="delivery">
              <span class="fo-ic">🚚</span><span><b>Home delivery</b><small id="deliveryPrice">Delivered to you</small></span></label>
          </div>
          <div class="muted small" id="deliveryNote" style="margin:-4px 0 12px"></div>
        </div>

        <div class="card-title" id="detailsTitle">Your details <span class="opt">(optional)</span></div>
        <div class="row">
          <label class="field"><span>Name <i class="req hidden">*</i></span><input class="input" id="custName" autocomplete="name" maxlength="80"></label>
          <label class="field"><span>Mobile number <i class="req hidden">*</i></span><input class="input" id="custPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="10-digit mobile"></label>
        </div>
        <div id="addressFields" class="hidden">
          <label class="field"><span>Delivery address <i class="req">*</i></span>
            <textarea class="input" id="delAddress" autocomplete="street-address" maxlength="500" rows="3" placeholder="House / flat no., street, area, city"></textarea></label>
          <div class="row">
            <label class="field"><span>Landmark</span><input class="input" id="delLandmark" maxlength="120" placeholder="Near…"></label>
            <label class="field"><span>Pincode</span><input class="input" id="delPincode" inputmode="numeric" autocomplete="postal-code" maxlength="6" placeholder="6 digits"></label>
          </div>
        </div>

        <div id="formErr" class="banner danger hidden"></div>
        <button class="btn btn-primary btn-lg btn-block" id="placeBtn" type="button">Generate bill</button>
        <p class="muted small secure-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          Pay securely with any UPI app on the next screen
        </p>
      </aside>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
