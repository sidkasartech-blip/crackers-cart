<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c2d12">
  <title>Shop Crackers</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div>
        <h1 id="shopName">Crackers</h1>
        <div class="tagline" id="tagline"></div>
      </div>
      <span class="spacer"></span>
      <a class="btn btn-sm" href="/checkout" id="cartLink">Cart <span id="cartCount" class="num">0</span></a>
    </div>
  </header>

  <main class="wrap">
    <div id="closed" class="banner warn hidden"></div>
    <a id="lastBill" class="banner ok hidden" style="display:block;text-decoration:none"></a>
    <div class="offers" id="offers"></div>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="q" type="search" placeholder="Search crackers…" autocomplete="off">
      </div>
      <div class="chips" id="chips" role="toolbar" aria-label="Categories"></div>
    </div>
    <div class="grid" id="grid"><div class="empty">Loading…</div></div>
  </main>

  <div class="cartbar" id="cartbar">
    <div class="wrap">
      <div class="sum">
        <div><span id="barCount">0</span> items · <b class="num" id="barTotal">₹0</b></div>
        <div class="nudge" id="barNudge"></div>
      </div>
      <a class="btn btn-primary btn-lg" href="/checkout">Checkout →</a>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
